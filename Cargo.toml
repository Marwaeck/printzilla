[package]
name = "printzilla"
version = "0.1.0"
edition = "2021"
description = "PrintZilla – eine Bibliothek für 3D-Druck-Dateien mit 3MF-Ansicht"
repository = "https://github.com/Marwaeck/printzilla"

[[bin]]
name = "printzilla"
path = "src/main.rs"

[dependencies]
eframe = "0.37"
winit = "0.30"
rfd = "0.17"
zip = { version = "2", default-features = false, features = ["deflate"] }
trash = "5"
walkdir = "2.5"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "ico"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
self_update = { version = "0.42", default-features = false, features = ["archive-zip", "compression-zip-deflate", "rustls"] }

[build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = 3
lto = "thin"
strip = true

[profile.dev]
opt-level = 2

[profile.dev.package."*"]
opt-level = 2
