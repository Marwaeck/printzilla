[package]
name = "printzilla"
version = "3.0.1"
edition = "2021"
description = "PrintZilla – eine Bibliothek für 3D-Druck-Dateien mit 3MF-Ansicht"
repository = "https://github.com/Marwaeck/printzilla"
license = "MIT"
authors = ["Marwaeck"]

[[bin]]
name = "printzilla"
path = "src/main.rs"

[dependencies]
eframe = "0.37"
winit = "0.30"
rfd = "0.17"
zip = { version = "2", default-features = false, features = ["deflate"] }
trash = "5"
walkdir = "2.5"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "ico"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
flate2 = "1"
dirs = "6"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
self_update = { version = "0.42", default-features = false, features = ["archive-zip", "compression-zip-deflate", "rustls"] }

# icon in the macOS menu bar / Windows notification area
[target.'cfg(any(windows, target_os = "macos"))'.dependencies]
tray-icon = "0.26"
notify-rust = "4"

# number on the Dock icon (macOS)
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
libc = "0.2"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSString", "NSBundle"] }
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSApplication", "NSDockTile", "NSResponder"] }

[build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = 3
lto = "thin"
strip = true

[profile.dev]
opt-level = 2

[profile.dev.package."*"]
opt-level = 2
